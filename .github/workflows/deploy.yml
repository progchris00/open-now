name: Deploy

# develop  -> staging, after CI passes.
# v1.2.3   -> production, after CI passes, only when the tag is on main
#             (merge develop into main, then tag main).
# Nothing deploys until the repository variable DEPLOY_ENABLED is "true".
# Server setup and the secrets this needs are in infra/README.md.

on:
  push:
    branches: [develop]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Pick environment and image tag
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pick the environment
        id: target
        run: python3 infra/release_target.py "$GITHUB_REF" "$GITHUB_SHA"
      - name: Say why nothing deploys yet
        if: vars.DEPLOY_ENABLED != 'true'
        run: >-
          echo "::notice::Deploys are off. Finish the server setup in
          infra/README.md, then set the repository variable
          DEPLOY_ENABLED to true."

  build:
    name: Build ${{ matrix.service }} image
    needs: [ci, release]
    if: vars.DEPLOY_ENABLED == 'true'
    # The Oracle Always Free server is an Ampere A1 (arm64) machine.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
          - service: web
            context: web
          - service: db
            context: docker/postgis
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare optional static assets directory
        if: matrix.service == 'web'
        run: mkdir -p web/public
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.release.outputs.image_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to ${{ needs.release.outputs.environment }}
    needs: [release, build]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ needs.release.outputs.environment }}
      url: https://${{ vars.APP_DOMAIN }}
    concurrency:
      group: deploy-${{ needs.release.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.release.outputs.environment }}
      IMAGE_TAG: ${{ needs.release.outputs.image_tag }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      SERVER_DIR: /srv/opennow/${{ needs.release.outputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Connect to the server
        run: infra/ci/setup-ssh.sh
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Copy the release files to the server
        run: |
          scp docker/compose.server.yaml "opennow-server:$SERVER_DIR/compose.yaml"
          scp docker/Caddyfile "opennow-server:$SERVER_DIR/Caddyfile"
          scp infra/deploy.py "opennow-server:$SERVER_DIR/deploy.py"
      - name: Let the server pull the images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: >-
          printf '%s' "$REGISTRY_TOKEN" |
          ssh opennow-server docker login ghcr.io
          --username "$REGISTRY_USER" --password-stdin
      - name: Deploy ${{ needs.release.outputs.image_tag }}
        run: >-
          ssh opennow-server python3 $SERVER_DIR/deploy.py deploy
          --env "$ENVIRONMENT" --tag "$IMAGE_TAG"
          --image-prefix "$IMAGE_PREFIX"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright
        run: pnpm --dir e2e install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Smoke test the deployed site
        id: smoke
        run: pnpm --dir e2e test
        env:
          PLAYWRIGHT_BASE_URL: https://${{ vars.APP_DOMAIN }}
      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: >-
          ssh opennow-server python3 $SERVER_DIR/deploy.py rollback
          --env "$ENVIRONMENT" --image-prefix "$IMAGE_PREFIX"
