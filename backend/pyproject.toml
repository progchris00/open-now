[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6,<5.7",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.29,<0.30",
    "gunicorn>=26,<27",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "schemathesis>=4.33.4",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "settings_store/tests", "audit/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
