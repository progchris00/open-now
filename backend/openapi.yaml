openapi: 3.1.0
info:
  title: OpenNow API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API and database health
      security: []
      responses:
        "200":
          description: API, database, and PostGIS are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database or PostGIS is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      summary: List admin settings
      security:
        - sessionAuth: []
        - basicAuth: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
        "403":
          description: User is not an administrator
  /api/admin/settings/{key}:
    patch:
      operationId: patchAdminSetting
      summary: Update an admin setting
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: Invalid value or locked setting
        "403":
          description: User is not an administrator
        "404":
          description: Setting does not exist
  /api/admin/audit:
    get:
      operationId: getAdminAudit
      summary: List audit entries
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: target_type
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: User is not an administrator
  /api/orders:
    post:
      operationId: placeOrder
      summary: Place a cash-on-delivery order
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            A new random value for each order. Retrying with the same key
            returns the first order.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrder"
      responses:
        "201":
          description: Order placed with status New
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: Already placed with this Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid cart, bill below the total, or not cash
        "403":
          description: Not signed in as a customer
        "409":
          description: Idempotency-Key already used for a different order
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
    basicAuth:
      type: http
      scheme: basic
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        postgis:
          type: string
          enum: [ok]
    HealthError:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [error]
        database:
          type: string
          enum: [unavailable]
        postgis:
          type: string
          enum: [unknown]
    Setting:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - updated_by
        - updated_at
      properties:
        key:
          type: string
        value: {}
        updated_by:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
    SettingUpdate:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value: {}
    AuditLog:
      type: object
      additionalProperties: false
      required:
        - id
        - who
        - who_label
        - what
        - target_type
        - target_id
        - before
        - after
        - when
      properties:
        id:
          type: integer
        who:
          type: [integer, "null"]
        who_label:
          type: string
        what:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        before: {}
        after: {}
        when:
          type: string
          format: date-time
    Pesos:
      type: string
      format: decimal
      pattern: '^\d{1,8}(\.\d{1,2})?$'
      description: A non-negative peso amount, such as "1000.00"
    PlaceOrderLine:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    PlaceOrder:
      type: object
      description: >-
        What the customer sends. Prices, fees and totals are never read from
        it; the server works them out.
      required:
        - items
        - distance_km
        - bill
        - payment_method
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PlaceOrderLine"
        distance_km:
          type: string
          format: decimal
          pattern: '^\d{1,4}(\.\d{1,3})?$'
          description: >-
            TEMPORARY until S2-11 (delivery details): distance from the shop
            to the customer in km.
        bill:
          $ref: "#/components/schemas/Pesos"
        payment_method:
          type: string
          enum: [cod]
    OrderItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - name
        - unit_price
        - quantity
        - line_total
      properties:
        product_id:
          type: integer
        name:
          type: string
        unit_price:
          $ref: "#/components/schemas/Pesos"
        quantity:
          type: integer
          minimum: 1
        line_total:
          $ref: "#/components/schemas/Pesos"
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - shop_id
        - payment_method
        - items
        - items_total
        - delivery_fee
        - service_fee
        - discount
        - total
        - bill
        - change
        - created_at
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [new]
        shop_id:
          type: integer
        payment_method:
          type: string
          enum: [cod]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        items_total:
          $ref: "#/components/schemas/Pesos"
        delivery_fee:
          $ref: "#/components/schemas/Pesos"
        service_fee:
          $ref: "#/components/schemas/Pesos"
        discount:
          $ref: "#/components/schemas/Pesos"
        total:
          $ref: "#/components/schemas/Pesos"
        bill:
          $ref: "#/components/schemas/Pesos"
        change:
          $ref: "#/components/schemas/Pesos"
        created_at:
          type: string
          format: date-time
