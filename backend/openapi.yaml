openapi: 3.1.0
info:
  title: OpenNow API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report the public service health
      responses:
        "200":
          description: The API, database, and PostGIS extension are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [ok, error]
        postgis:
          type: string
          enum: [ok, missing, error]
