openapi: 3.1.0
info:
  title: OpenNow API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API and database health
      security: []
      responses:
        "200":
          description: API, database, and PostGIS are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database or PostGIS is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      summary: List admin settings
      security:
        - sessionAuth: []
        - basicAuth: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
        "403":
          description: User is not an administrator
  /api/admin/settings/{key}:
    patch:
      operationId: patchAdminSetting
      summary: Update an admin setting
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: Invalid value or locked setting
        "403":
          description: User is not an administrator
        "404":
          description: Setting does not exist
  /api/admin/audit:
    get:
      operationId: getAdminAudit
      summary: List audit entries
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: target_type
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: User is not an administrator
  /api/admin/orders/{id}/cash:
    get:
      operationId: getAdminOrderCash
      summary: List the append-only cash ledger for an order
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cash records and balances for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCash"
        "403":
          description: User is not an administrator
        "404":
          description: Order does not exist
  /api/admin/cash/corrections:
    post:
      operationId: createAdminCashCorrection
      summary: Add a correcting cash line without editing an existing line
      security:
        - sessionAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashCorrectionRequest"
      responses:
        "201":
          description: Correcting cash line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashRecord"
        "400":
          description: Invalid correction
        "403":
          description: User is not an administrator
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
    basicAuth:
      type: http
      scheme: basic
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        postgis:
          type: string
          enum: [ok]
    HealthError:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [error]
        database:
          type: string
          enum: [unavailable]
        postgis:
          type: string
          enum: [unknown]
    Setting:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - updated_by
        - updated_at
      properties:
        key:
          type: string
        value: {}
        updated_by:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
    SettingUpdate:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value: {}
    AuditLog:
      type: object
      additionalProperties: false
      required:
        - id
        - who
        - who_label
        - what
        - target_type
        - target_id
        - before
        - after
        - when
      properties:
        id:
          type: integer
        who:
          type: [integer, "null"]
        who_label:
          type: string
        what:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        before: {}
        after: {}
        when:
          type: string
          format: date-time
    CashParty:
      type: string
      enum: [customer, rider, shop, platform, coordinator]
    CashRecordType:
      type: string
      enum: [customer_payment, change, shop_payout, delivery_payment, correction]
    CashRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - order
        - type
        - amount
        - from
        - to
        - created_by
        - reason
        - created_at
      properties:
        id:
          type: integer
        order:
          type: integer
        type:
          $ref: "#/components/schemas/CashRecordType"
        amount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        from:
          $ref: "#/components/schemas/CashParty"
        to:
          $ref: "#/components/schemas/CashParty"
        created_by:
          type: [integer, "null"]
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    OrderCash:
      type: object
      additionalProperties: false
      required: [order, records, balances]
      properties:
        order:
          type: integer
        records:
          type: array
          items:
            $ref: "#/components/schemas/CashRecord"
        balances:
          type: object
          additionalProperties:
            type: string
            pattern: "^-?[0-9]+\\.[0-9]{2}$"
    CashCorrectionRequest:
      type: object
      additionalProperties: false
      required: [order, amount, from, to, reason]
      properties:
        order:
          type: integer
        amount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        from:
          $ref: "#/components/schemas/CashParty"
        to:
          $ref: "#/components/schemas/CashParty"
        reason:
          type: string
          minLength: 1
