openapi: 3.1.0
info:
  title: OpenNow API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API and database health
      security: []
      responses:
        "200":
          description: API, database, and PostGIS are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database or PostGIS is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      summary: List admin settings
      security:
        - sessionAuth: []
        - basicAuth: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
        "403":
          description: User is not an administrator
  /api/admin/settings/{key}:
    patch:
      operationId: patchAdminSetting
      summary: Update an admin setting
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: Invalid value or locked setting
        "403":
          description: User is not an administrator
        "404":
          description: Setting does not exist
  /api/admin/audit:
    get:
      operationId: getAdminAudit
      summary: List audit entries
      security:
        - sessionAuth: []
        - basicAuth: []
      parameters:
        - name: target_type
          in: query
          required: false
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "403":
          description: User is not an administrator
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
    basicAuth:
      type: http
      scheme: basic
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        postgis:
          type: string
          enum: [ok]
    HealthError:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - postgis
      properties:
        status:
          type: string
          enum: [error]
        database:
          type: string
          enum: [unavailable]
        postgis:
          type: string
          enum: [unknown]
    Setting:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - updated_by
        - updated_at
      properties:
        key:
          type: string
        value: {}
        updated_by:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
    SettingUpdate:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value: {}
    AuditLog:
      type: object
      additionalProperties: false
      required:
        - id
        - who
        - who_label
        - what
        - target_type
        - target_id
        - before
        - after
        - when
      properties:
        id:
          type: integer
        who:
          type: [integer, "null"]
        who_label:
          type: string
        what:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        before:
          nullable: true
        after:
          nullable: true
        when:
          type: string
          format: date-time
