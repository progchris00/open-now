x-backend: &backend
  build:
    context: ./backend
  environment:
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,api}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-secret-key}
    POSTGRES_DB: ${POSTGRES_DB:-opennow}
    POSTGRES_USER: ${POSTGRES_USER:-opennow}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opennow}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: ./web

  api:
    <<: *backend
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info

  db:
    build:
      context: ./docker/postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opennow}
      POSTGRES_USER: ${POSTGRES_USER:-opennow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opennow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
